spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: travel
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

community:
  image:
    storage: ${COMMUNITY_IMAGE_STORAGE:s3}
    bucket: ${COMMUNITY_IMAGE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration-minutes: ${COMMUNITY_IMAGE_URL_EXPIRATION_MINUTES:30}
    max-file-size: 10485760
    max-images-per-post: 5
    local:
      directory: ${COMMUNITY_IMAGE_LOCAL_DIRECTORY:./uploads}
      base-url: ${COMMUNITY_IMAGE_LOCAL_BASE_URL:http://localhost:8080/local-images}
  draft-cleanup:
    cron: "0 0 4 * * *"
    zone: Asia/Seoul
  deleted-post-cleanup:
    cron: "0 30 4 * * *"
    zone: Asia/Seoul
  image-deletion:
    cron: "0 */10 * * * *"
    zone: Asia/Seoul

jwt:
  # 운영 환경에서는 반드시 충분히 긴 무작위 값으로 교체하세요.
  secret-key: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
  cookie-secure: ${JWT_COOKIE_SECURE}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

gathering:
  cleanup:
    cron: "0 0 0 * * MON"
    zone: Asia/Seoul

travel:
  saved-guide-cleanup:
    cron: "0 0 5 * * MON"
    zone: Asia/Seoul

tour-info:
  service-key: ${TOUR_INFO_KOREAN_API:}
  base-url: https://apis.data.go.kr/B551011/KorService2
  mobile-os: ETC
  mobile-app: tour_gong

kakao-map:
  rest-api-key: ${KAKAO_MAP_REST_API_KEY:${KAKAO_CLIENT_ID}}
  base-url: https://dapi.kakao.com

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.6-luna}
  base-url: https://api.openai.com

tour-job:
  service-key: ${TOUR_JOB_API_KEY:}
  base-url: https://apis.data.go.kr/B551011/tursmService
  mobile-os: ETC
  mobile-app: tour_gong

junnam-public-job:
  service-key: ${JUNNAM_PUBLIC_JOB_API:}
  base-url: https://apis.data.go.kr/6460000/jnGovjobInfo
