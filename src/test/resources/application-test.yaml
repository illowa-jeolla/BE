spring:
  datasource:
    url: jdbc:h2:mem:travel-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
      password: test

jwt:
  secret-key: test-secret-key-must-be-at-least-32-bytes-long
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000
  cookie-secure: false

kakao:
  client-id: test
  client-secret: test
  redirect-uri: http://localhost/test

google:
  client-id: test
  client-secret: test
  redirect-uri: http://localhost/test

kakao-map:
  rest-api-key: test

frontend:
  oauth-callback-uri: http://localhost:5173/oauth/callback
  origin: http://localhost:5173
